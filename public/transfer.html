<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支付中心</title>
    <style>
      :root {
        --bg: #071a25;
        --bg-2: #0d2742;
        --panel: rgba(10, 20, 28, 0.82);
        --panel-soft: rgba(18, 32, 44, 0.7);
        --panel-border: rgba(148, 163, 184, 0.18);
        --text: #edf9ff;
        --muted: #aac4d8;
        --accent: #7fe7ff;
        --accent-strong: #38bdf8;
        --success: #4ade80;
        --warning: #fbbf24;
        --shadow: 0 28px 84px rgba(2, 6, 12, 0.45);
      }

      html[data-theme='day'] {
        --bg: #ecf8ff;
        --bg-2: #ddeeff;
        --panel: rgba(255,255,255,0.88);
        --panel-soft: rgba(245,250,255,0.9);
        --panel-border: rgba(15, 23, 42, 0.08);
        --text: #122334;
        --muted: #53677c;
        --accent: #0ea5e9;
        --accent-strong: #0284c7;
        --success: #0f766e;
        --warning: #b45309;
        --shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 10%, rgba(127, 231, 255, 0.18), transparent 24%),
          radial-gradient(circle at 90% 18%, rgba(56, 189, 248, 0.18), transparent 22%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
      }
      a { color: inherit; text-decoration: none; }
      button, input, select, textarea { font: inherit; }

      .shell {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 72px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 18px;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        margin-bottom: 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #02151d;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .nav a,
      .nav button {
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-weight: 700;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .nav a {
        color: var(--muted);
      }

      .nav a:hover,
      .nav button:hover {
        transform: translateY(-1px);
      }

      .nav a.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #02151d;
      }

      .nav button {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-color: var(--panel-border);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr;
        gap: 22px;
        margin-bottom: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero-copy {
        padding: 28px 28px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .hero-badge {
        display: inline-flex;
        align-items: center;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(127, 231, 255, 0.08);
        border: 1px solid rgba(127,231,255,0.2);
        color: var(--accent);
        letter-spacing: 0.12em;
        font-size: 12px;
        font-weight: 800;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.5rem, 5vw, 4.2rem);
        line-height: 1.04;
      }

      .lead {
        margin: 0 auto;
        max-width: 620px;
        color: var(--muted);
        font-size: 1.06rem;
        line-height: 1.9;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 20px;
        border-radius: 14px;
        border: 1px solid transparent;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover { transform: translateY(-1px); }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #02151d;
        box-shadow: 0 18px 30px rgba(56, 189, 248, 0.2);
      }
      .btn.secondary {
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border-color: var(--panel-border);
      }

      .stats {
        margin-top: 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .stat-pill {
        padding: 9px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--panel-border);
        color: var(--muted);
        font-size: 0.82rem;
      }

      .hero-side {
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .mini-box {
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.03);
        border-radius: 18px;
        padding: 18px;
      }

      .mini-box h3 {
        margin: 0 0 12px;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .money {
        font-size: clamp(2rem, 3vw, 2.8rem);
        font-weight: 900;
        margin: 8px 0 10px;
      }

      .mini-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .mini-card {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--panel-border);
      }

      .mini-card span {
        display: block;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .mini-card strong {
        font-size: 1rem;
      }

      .feature-wrap {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .feature-card {
        padding: 22px 20px;
        border-radius: 22px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .feature-icon {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(127,231,255,0.14), rgba(56,189,248,0.18));
        border: 1px solid rgba(127,231,255,0.2);
        font-size: 1.4rem;
      }

      .feature-card h3 {
        margin: 0;
        font-size: 1.08rem;
      }

      .feature-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        min-height: 52px;
      }

      .feature-card .feature-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: auto;
        width: fit-content;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--panel-border);
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .feature-card .feature-link:hover {
        transform: translateY(-1px);
        border-color: rgba(127, 231, 255, 0.28);
        background: rgba(127, 231, 255, 0.06);
        box-shadow: 0 12px 24px rgba(1, 9, 16, 0.18);
      }

      .recent-panel {
        margin-top: 22px;
        padding: 22px 20px;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow);
      }

      .recent-panel h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
      }

      .recent-list {
        display: grid;
        gap: 12px;
      }

      .recent-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--panel-border);
      }

      .recent-meta {
        display: grid;
        gap: 4px;
      }

      .recent-meta strong {
        font-size: 0.96rem;
      }

      .recent-meta span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .recent-amount {
        font-weight: 900;
        color: var(--accent);
      }

      .side-panel {
        padding: 20px;
      }

      .side-panel h2,
      .main-panel h2 {
        margin: 0 0 14px;
        font-size: 1.3rem;
      }

      .link-list {
        display: grid;
        gap: 10px;
      }

      .link-list a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.02);
      }

      .link-list a span:last-child {
        color: var(--muted);
      }

      .bottom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        margin-top: 22px;
      }

      .main-panel,
      .transfer-panel {
        padding: 20px;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      input, select, textarea {
        width: 100%;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        outline: none;
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(127,231,255,0.46);
        box-shadow: 0 0 0 4px rgba(127,231,255,0.08);
      }

      textarea { min-height: 90px; resize: vertical; }

      .amount-bar {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .amount-sign {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(127,231,255,0.1);
        border: 1px solid rgba(127,231,255,0.2);
        color: var(--accent);
        font-weight: 900;
      }

      .amount-bar input {
        flex: 1;
      }

      .status-box {
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(74, 222, 128, 0.08);
        border: 1px solid rgba(74, 222, 128, 0.18);
        color: var(--success);
      }

      .status-box.warning {
        background: rgba(251, 191, 36, 0.08);
        border-color: rgba(251, 191, 36, 0.2);
        color: var(--warning);
      }

      .muted-block {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.7;
      }

      @media (max-width: 960px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .feature-wrap {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>支付中心</div>
        </div>
        <nav class="nav" aria-label="主导航">
          <a href="/transfer.html" class="active">首页</a>
          <a href="/account-management.html">账户管理</a>
          <a href="/transfer-entry.html">转账</a>
          <button id="themeToggle" type="button">🌙 夜间</button>
        </nav>
      </header>

      <section class="hero" id="home">
        <div class="panel hero-copy">
          <span class="hero-badge">PAYMENT CENTER</span>
          <h1>支付中心</h1>
          <p class="lead">
            简洁、安全的收款与转账入口。登录后可直接进入账户中心与转账页面，快速完成日常收支操作。
          </p>
          <div class="cta-row" style="display:none;">
            <a class="btn primary" href="/transfer-entry.html">立即转账</a>
            <a class="btn secondary" href="/account-management.html">账户中心</a>
          </div>
        </div>
      </section>

      <section class="feature-wrap" aria-label="功能入口">
        <article class="feature-card">
          <div class="feature-icon">👤</div>
          <h3>账户中心</h3>
          <p>注册账号、登录并查看自己的收款信息。</p>
          <a class="feature-link" href="/account-management.html">进入账户页</a>
        </article>

        <article class="feature-card">
          <div class="feature-icon">💳</div>
          <h3>收款设置</h3>
          <p>收款方式、暗号和支付信息统一管理。</p>
          <a class="feature-link" href="/payment-settings.html">查看设置</a>
        </article>

        <article class="feature-card">
          <div class="feature-icon">⚡</div>
          <h3>快捷转账</h3>
          <p>填写收款方与金额，快速完成一笔交易。</p>
          <a class="btn primary" href="/transfer-entry.html">去转账</a>
        </article>
      </section>

      <section class="recent-panel" aria-label="最近交易">
        <h2>最近交易</h2>
        <div class="recent-list" id="recentList">
          <div class="recent-item">
            <div class="recent-meta">
              <strong>暂无记录</strong>
              <span>完成一笔转账后会显示在这里</span>
            </div>
            <div class="recent-amount">—</div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      const recentList = document.getElementById('recentList');
      const themeStorageKey = 'mctools-main-theme';
      const transfersStorageKey = 'mctools-main-transfers';

      function setTheme(theme) {
        const normalized = theme === 'day' ? 'day' : 'night';
        document.documentElement.setAttribute('data-theme', normalized);
        themeToggle.textContent = normalized === 'day' ? '☀️ 白天' : '🌙 夜间';
        try { localStorage.setItem(themeStorageKey, normalized); } catch {}
      }

      function getPreferredTheme() {
        try { return localStorage.getItem(themeStorageKey) || 'night'; }
        catch { return 'night'; }
      }

      function renderRecentTransfers() {
        try {
          const transfers = JSON.parse(localStorage.getItem(transfersStorageKey) || '[]') || [];
          if (!transfers.length) {
            recentList.innerHTML = `
              <div class="recent-item">
                <div class="recent-meta">
                  <strong>暂无记录</strong>
                  <span>完成一笔转账后会显示在这里</span>
                </div>
                <div class="recent-amount">—</div>
              </div>
            `;
            return;
          }

          recentList.innerHTML = transfers.slice(0, 4).map((item) => {
            const dateText = item.time ? new Date(item.time).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '刚刚';
            return `
              <div class="recent-item">
                <div class="recent-meta">
                  <strong>${(item.receiver || '收款方')}</strong>
                  <span>${dateText}${item.remark ? ' · ' + item.remark : ''}</span>
                </div>
                <div class="recent-amount">-¥${Number(item.amount || 0).toFixed(2)}</div>
              </div>
            `;
          }).join('');
        } catch {
          recentList.innerHTML = `
            <div class="recent-item">
              <div class="recent-meta">
                <strong>暂无记录</strong>
                <span>完成一笔转账后会显示在这里</span>
              </div>
              <div class="recent-amount">—</div>
            </div>
          `;
        }
      }

      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        setTheme(next);
      });

      renderRecentTransfers();
      setTheme(getPreferredTheme());
    </script>
  </body>
</html>
