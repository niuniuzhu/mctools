<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫码确认登录</title>
    <script>
      try {
        const storedUi = localStorage.getItem('mctools-ui') || 'normal';
        document.documentElement.dataset.ui = storedUi;
      } catch {
        document.documentElement.dataset.ui = 'normal';
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .scan-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .scan-card {
        position: relative;
        width: min(100%, 560px);
        border-radius: 24px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 28px;
        overflow: hidden;
        transform-origin: center;
        animation: scanCardIn 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
        will-change: transform, opacity;
      }

      .scan-card::before {
        content: "";
        position: absolute;
        inset: -30% auto auto -20%;
        width: 180%;
        height: 260%;
        background: radial-gradient(circle at center, rgba(184, 240, 255, 0.18), transparent 52%);
        transform: rotate(12deg);
        pointer-events: none;
        animation: scanGlow 9s ease-in-out infinite alternate;
      }

      .scan-card > * {
        position: relative;
        z-index: 1;
      }

      .scan-visual {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 22px 0 14px;
      }

      .scan-frame {
        position: relative;
        width: min(100%, 220px);
        aspect-ratio: 1;
        border-radius: 24px;
        border: 1px solid rgba(184, 240, 255, 0.3);
        background: linear-gradient(180deg, rgba(184, 240, 255, 0.08), rgba(184, 240, 255, 0.02));
        box-shadow: inset 0 0 20px rgba(184, 240, 255, 0.08), 0 16px 40px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .scan-frame::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 18px;
        border: 1px solid rgba(184, 240, 255, 0.15);
        background-image:
          linear-gradient(rgba(184, 240, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(184, 240, 255, 0.08) 1px, transparent 1px);
        background-size: 16px 16px;
      }

      .scan-line {
        position: absolute;
        left: 10%;
        width: 80%;
        height: 4px;
        background: linear-gradient(90deg, transparent, rgba(184, 240, 255, 0.9), transparent);
        box-shadow: 0 0 18px rgba(184, 240, 255, 0.7);
        animation: scanLineMove 2.8s ease-in-out infinite;
      }

      .scan-corner {
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: var(--accent);
        border-style: solid;
      }

      .scan-corner.top-left {
        top: 12px;
        left: 12px;
        border-width: 3px 0 0 3px;
        border-top-left-radius: 8px;
      }

      .scan-corner.top-right {
        top: 12px;
        right: 12px;
        border-width: 3px 3px 0 0;
        border-top-right-radius: 8px;
      }

      .scan-corner.bottom-left {
        bottom: 12px;
        left: 12px;
        border-width: 0 0 3px 3px;
        border-bottom-left-radius: 8px;
      }

      .scan-corner.bottom-right {
        bottom: 12px;
        right: 12px;
        border-width: 0 3px 3px 0;
        border-bottom-right-radius: 8px;
      }

      .scan-card h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }

      .scan-card p,
      .scan-card li {
        color: var(--muted);
        line-height: 1.75;
      }

      .scan-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .scan-btn,
      .scan-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 16px;
        border-radius: 12px;
        border: 1px solid var(--panel-border);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.25s ease,
          background 0.25s ease,
          opacity 0.2s ease;
        will-change: transform;
      }

      .scan-btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .scan-btn:hover:not(:disabled),
      .scan-link:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(101, 217, 255, 0.12);
      }

      .scan-btn:active:not(:disabled),
      .scan-link:active {
        transform: translateY(0);
      }

      .scan-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .scan-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .scan-status-row {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
      }

      .scan-status-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        font-size: 0.9rem;
        font-weight: 700;
        border-radius: 50%;
        background: rgba(184, 240, 255, 0.08);
        color: var(--accent);
        border: 1px solid rgba(184, 240, 255, 0.2);
        transition: all 0.25s ease;
      }

      .scan-status-icon.success {
        background: rgba(34, 197, 94, 0.12);
        color: #4ade80;
        border-color: rgba(74, 222, 128, 0.26);
      }

      .scan-status-icon.error {
        background: rgba(248, 113, 113, 0.12);
        color: #fca5a5;
        border-color: rgba(252, 165, 165, 0.26);
      }

      .scan-status-icon.pending {
        background: rgba(184, 240, 255, 0.08);
        color: var(--accent);
      }

      .scan-status {
        min-height: 24px;
        color: var(--text);
        transition: color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
      }

      .scan-status.is-updating {
        transform: translateY(-1px);
      }

      .scan-timer {
        font-size: 0.82rem;
        color: var(--muted);
        letter-spacing: 0.02em;
        min-width: 120px;
        text-align: right;
      }

      .scan-list {
        margin: 18px 0 0;
        padding-left: 20px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(184, 240, 255, 0.25);
        background: rgba(184, 240, 255, 0.08);
        color: var(--accent);
        animation: badgePulse 2.8s ease-in-out infinite;
      }

      @keyframes scanCardIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes scanGlow {
        0% {
          opacity: 0.4;
          transform: translate3d(-10px, 0, 0) rotate(12deg);
        }
        50% {
          opacity: 0.8;
          transform: translate3d(10px, 4px, 0) rotate(12deg);
        }
        100% {
          opacity: 0.45;
          transform: translate3d(0, -8px, 0) rotate(12deg);
        }
      }

      @keyframes scanLineMove {
        0% {
          top: 12%;
          opacity: 0.3;
        }
        50% {
          top: 82%;
          opacity: 1;
        }
        100% {
          top: 12%;
          opacity: 0.3;
        }
      }

      @keyframes badgePulse {
        0%,
        100% {
          box-shadow: 0 0 0 rgba(101, 217, 255, 0);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 18px rgba(101, 217, 255, 0.24);
          transform: scale(1.02);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="scan-shell">
      <section class="scan-card">
        <p class="badge">QR Login</p>
        <h1>扫码确认登录</h1>
        <div class="scan-visual" aria-hidden="true">
          <div class="scan-frame">
            <div class="scan-line"></div>
            <span class="scan-corner top-left"></span>
            <span class="scan-corner top-right"></span>
            <span class="scan-corner bottom-left"></span>
            <span class="scan-corner bottom-right"></span>
          </div>
        </div>
        <p data-scan-copy>正在检查当前设备的登录状态。</p>
        <div class="scan-actions">
          <button type="button" class="scan-btn primary" data-scan-approve disabled>确认登录</button>
          <a class="scan-link" href="/login.html">返回登录页</a>
        </div>
        <div class="scan-meta">
          <div class="scan-status-row">
            <span class="scan-status-icon pending" data-scan-icon>•</span>
            <p class="scan-status" data-scan-status>等待检查</p>
          </div>
          <div class="scan-timer" data-scan-timer>有效期：--</div>
        </div>
        <ul class="scan-list">
          <li>请在已经登录账号的设备上打开此页面。</li>
          <li>点击“确认登录”后，原浏览器会自动登录当前账号。</li>
          <li>二维码超时后，需要回到原页面重新刷新。</li>
        </ul>
      </section>
    </main>
    <script>
      (() => {
        const approveButton = document.querySelector('[data-scan-approve]');
        const statusText = document.querySelector('[data-scan-status]');
        const copyText = document.querySelector('[data-scan-copy]');
        const statusIcon = document.querySelector('[data-scan-icon]');
        const timerText = document.querySelector('[data-scan-timer]');
        const params = new URLSearchParams(window.location.search);
        const token = String(params.get('token') || '').trim();
        const countdownSeconds = 180;
        let countdownRemaining = countdownSeconds;

        function setStatus(text, isError, isSuccess) {
          statusText.classList.add('is-updating');
          requestAnimationFrame(() => {
            statusText.textContent = text;
            statusText.style.color = isError ? '#fca5a5' : isSuccess ? '#86efac' : '';
            statusText.classList.remove('is-updating');
          });

          statusIcon.classList.remove('pending', 'success', 'error');
          if (isSuccess) {
            statusIcon.textContent = '✓';
            statusIcon.classList.add('success');
          } else if (isError) {
            statusIcon.textContent = '!';
            statusIcon.classList.add('error');
          } else {
            statusIcon.textContent = '•';
            statusIcon.classList.add('pending');
          }
        }

        function updateTimer() {
          const minutes = Math.floor(countdownRemaining / 60);
          const seconds = countdownRemaining % 60;
          timerText.textContent = `有效期：${minutes}:${String(seconds).padStart(2, '0')}`;
        }

        function startCountdown() {
          updateTimer();
          const timerId = setInterval(() => {
            if (countdownRemaining <= 0) {
              clearInterval(timerId);
              timerText.textContent = '有效期：已过期';
              setStatus('二维码已过期，请返回原页面重新生成。', true);
              approveButton.disabled = true;
              return;
            }

            countdownRemaining -= 1;
            updateTimer();
          }, 1000);
        }

        async function checkMe() {
          if (!token) {
            copyText.textContent = '当前二维码参数无效。';
            setStatus('缺少扫码票据，请返回原页面重新生成二维码。', true);
            return;
          }

          try {
            const response = await fetch('/api/me');

            if (!response.ok) {
              copyText.textContent = '当前设备尚未登录账号。';
              setStatus('请先在这台设备登录，再重新扫码或返回此页确认。', true);
              return;
            }

            const me = await response.json();
            copyText.textContent = `当前扫码设备已登录账号：${me.username}`;
            approveButton.disabled = false;
            setStatus('可以确认登录。', false, false);
            startCountdown();
          } catch {
            setStatus('网络请求失败，请稍后重试。', true, false);
          }
        }

        approveButton.addEventListener('click', async () => {
          approveButton.disabled = true;
          setStatus('正在确认登录...', false, false);

          try {
            const response = await fetch('/api/login/qr/approve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token })
            });
            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
              approveButton.disabled = false;
              setStatus(result.message || '确认失败，请稍后重试。', true, false);
              return;
            }

            countdownRemaining = 0;
            timerText.textContent = '有效期：已确认';
            setStatus(result.message || '已确认登录。', false, true);
            copyText.textContent = '原浏览器会自动完成登录，可返回原设备查看。';
          } catch {
            approveButton.disabled = false;
            setStatus('网络请求失败，请稍后重试。', true, false);
          }
        });

        if (!token) {
          setStatus('缺少扫码票据，请返回原页面重新生成二维码。', true, false);
          timerText.textContent = '有效期：已失效';
        } else {
          setStatus('等待检查', false, false);
          updateTimer();
        }

        checkMe();
      })();
    </script>
  </body>
</html>
