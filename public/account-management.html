<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCTools 账户管理</title>
    <style>
      :root {
        --bg: #071a25;
        --bg-2: #0d2742;
        --panel: rgba(10, 20, 28, 0.82);
        --panel-border: rgba(148, 163, 184, 0.18);
        --text: #edf9ff;
        --muted: #aac4d8;
        --accent: #7fe7ff;
        --accent-strong: #38bdf8;
        --success: #4ade80;
        --warning: #fbbf24;
        --shadow: 0 28px 84px rgba(2, 6, 12, 0.45);
      }
      html[data-theme='day'] {
        --bg: #ecf8ff;
        --bg-2: #ddeeff;
        --panel: rgba(255,255,255,0.88);
        --panel-border: rgba(15, 23, 42, 0.08);
        --text: #122334;
        --muted: #53677c;
        --accent: #0ea5e9;
        --accent-strong: #0284c7;
        --success: #0f766e;
        --warning: #b45309;
        --shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 10%, rgba(127, 231, 255, 0.18), transparent 24%), radial-gradient(circle at 90% 18%, rgba(56, 189, 248, 0.18), transparent 22%), linear-gradient(135deg, var(--bg), var(--bg-2));
      }
      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      .shell {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 72px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 18px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        margin-bottom: 22px;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: .08em; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #02151d;
      }
      .nav { display: flex; gap: 10px; flex-wrap: wrap; }
      .nav a, .nav button {
        padding: 9px 16px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer;
      }
      .nav a.active { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #02151d; }
      .panel {
        background: var(--panel); border: 1px solid var(--panel-border); border-radius: 24px; box-shadow: var(--shadow);
      }
      .content { padding: 24px; }
      .title { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 3rem); }
      .lead { margin: 0 0 20px; color: var(--muted); line-height: 1.8; }
      .grid { display: grid; gap: 18px; }
      .field { display: grid; gap: 8px; }
      .field label { color: var(--muted); font-size: .82rem; }
      input {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03); color: var(--text); outline: none;
      }
      input:focus { border-color: rgba(127,231,255,0.46); box-shadow: 0 0 0 4px rgba(127,231,255,0.08); }
      .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 14px; border: 1px solid transparent; font-weight: 800; cursor: pointer;
      }
      .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #02151d; }
      .btn.secondary { background: rgba(255,255,255,0.03); color: var(--text); border-color: var(--panel-border); }
      .status-box {
        margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(74, 222, 128, 0.08); border: 1px solid rgba(74, 222, 128, 0.18); color: var(--success);
      }
      .status-box.warning { background: rgba(251, 191, 36, 0.08); border-color: rgba(251, 191, 36, 0.2); color: var(--warning); }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>MCTools</div>
        </div>
        <nav class="nav" aria-label="主导航">
          <a href="/transfer.html">首页</a>
          <a href="/account-management.html" class="active">账户管理</a>
          <a href="/payment-settings.html">收款设置</a>
          <a href="/transfer-entry.html">转账</a>
          <button id="themeToggle" type="button">🌙 夜间</button>
        </nav>
      </header>

      <section class="panel content">
        <h1 class="title">账户管理</h1>
        <p class="lead">注册、登录和管理自己的收款信息。账户名只读展示，收款暗号设置在注册时或者登录后更新。</p>

        <div class="grid">
          <div class="field">
            <label for="loginUsername">账号</label>
            <input id="loginUsername" type="text" placeholder="请输入用户名" />
          </div>
          <div class="field">
            <label for="loginPassword">密码</label>
            <input id="loginPassword" type="password" placeholder="请输入密码" />
          </div>
          <div class="field">
            <label for="registerPaymentSecret">注册时收款暗号</label>
            <input id="registerPaymentSecret" type="password" placeholder="注册时必须设置暗号" />
          </div>
          <div class="cta-row">
            <button class="btn primary" type="button" id="registerAccountBtn">注册账号</button>
            <button class="btn secondary" type="button" id="loginAccountBtn">登录账号</button>
            <button class="btn secondary" type="button" id="logoutAccountBtn">退出登录</button>
          </div>
          <div class="status-box" id="statusBox">请先注册或登录，再填写收款信息。</div>

          <div class="field">
            <label for="accountName">我的账号名</label>
            <input id="accountName" type="text" readonly placeholder="登录后显示" />
          </div>
          <div class="field">
            <label for="accountStatus">当前状态</label>
            <input id="accountStatus" type="text" value="收款暗号仅可在注册时设置，账号页不可修改" readonly />
          </div>
        </div>
      </section>
    </main>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      const statusBox = document.getElementById('statusBox');
      const accountsStorageKey = 'mctools-main-accounts';
      const currentAccountStorageKey = 'mctools-main-current-account';
      const themeStorageKey = 'mctools-main-theme';

      function normalizeUserName(value) {
        return String(value || '').trim().toLowerCase();
      }

      function getAccounts() {
        try { return JSON.parse(localStorage.getItem(accountsStorageKey) || '{}') || {}; }
        catch { return {}; }
      }

      function saveAccounts(accounts) {
        try { localStorage.setItem(accountsStorageKey, JSON.stringify(accounts)); }
        catch {}
      }

      function getCurrentAccount() {
        try { return localStorage.getItem(currentAccountStorageKey) || ''; }
        catch { return ''; }
      }

      function setCurrentAccount(username) {
        try {
          if (username) localStorage.setItem(currentAccountStorageKey, username);
          else localStorage.removeItem(currentAccountStorageKey);
        } catch {}
      }

      function setTheme(theme) {
        const normalized = theme === 'day' ? 'day' : 'night';
        document.documentElement.setAttribute('data-theme', normalized);
        themeToggle.textContent = normalized === 'day' ? '☀️ 白天' : '🌙 夜间';
        try { localStorage.setItem(themeStorageKey, normalized); } catch {}
      }

      function getPreferredTheme() {
        try { return localStorage.getItem(themeStorageKey) || 'night'; }
        catch { return 'night'; }
      }

      function showStatus(message, isWarning = false) {
        statusBox.textContent = message;
        statusBox.className = isWarning ? 'status-box warning' : 'status-box';
      }

      function updateAccountFields() {
        const current = getCurrentAccount();
        const accountNameInput = document.getElementById('accountName');
        const accountStatusInput = document.getElementById('accountStatus');

        if (!current) {
          accountNameInput.value = '';
          accountStatusInput.value = '收款暗号仅可在注册时设置，账号页不可修改';
          return;
        }
        const account = getAccounts()[normalizeUserName(current)] || {};
        accountNameInput.value = account.accountName || current;
        accountStatusInput.value = account.paymentSecret ? '已设置收款暗号，账号页不可修改' : '未设置收款暗号，默认按登录密码处理';
      }

      document.getElementById('registerAccountBtn').addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const secret = document.getElementById('registerPaymentSecret').value.trim();
        if (!username || !password) {
          showStatus('请填写账号和密码后再注册。', true);
          return;
        }
        if (!secret) {
          showStatus('注册时必须设置收款暗号。', true);
          return;
        }
        const accounts = getAccounts();
        const key = normalizeUserName(username);
        if (accounts[key]) {
          showStatus('该账号已存在，请直接登录。', true);
          return;
        }
        accounts[key] = {
          username,
          password,
          accountName: username,
          paymentMethod: '',
          paymentSecret: secret,
          paymentCode: ''
        };
        saveAccounts(accounts);
        setCurrentAccount(username);
        updateAccountFields();
        showStatus('注册成功，已自动登录。');
      });

      document.getElementById('loginAccountBtn').addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!username || !password) {
          showStatus('请输入账号和密码后再登录。', true);
          return;
        }
        const account = getAccounts()[normalizeUserName(username)];
        if (!account || account.password !== password) {
          showStatus('账号或密码不正确。', true);
          return;
        }
        setCurrentAccount(username);
        updateAccountFields();
        showStatus(`欢迎回来，${account.accountName || username}。`);
      });

      document.getElementById('logoutAccountBtn').addEventListener('click', () => {
        if (!window.confirm('确认退出当前账号吗？')) {
          showStatus('已取消退出登录。');
          return;
        }

        setCurrentAccount('');
        updateAccountFields();
        showStatus('已退出登录。');
      });

      themeToggle.addEventListener('click', () => {
        const nextTheme = document.documentElement.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        setTheme(nextTheme);
      });

      setTheme(getPreferredTheme());
      updateAccountFields();
    </script>
  </body>
</html>
