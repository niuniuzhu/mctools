<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支付中心 - 收款设置</title>
    <style>
      :root {
        --bg: #071a25;
        --bg-2: #0d2742;
        --panel: rgba(10, 20, 28, 0.82);
        --panel-border: rgba(148, 163, 184, 0.18);
        --text: #edf9ff;
        --muted: #aac4d8;
        --accent: #7fe7ff;
        --accent-strong: #38bdf8;
        --success: #4ade80;
        --warning: #fbbf24;
        --shadow: 0 28px 84px rgba(2, 6, 12, 0.45);
      }
      html[data-theme='day'] {
        --bg: #ecf8ff;
        --bg-2: #ddeeff;
        --panel: rgba(255,255,255,0.88);
        --panel-border: rgba(15, 23, 42, 0.08);
        --text: #122334;
        --muted: #53677c;
        --accent: #0ea5e9;
        --accent-strong: #0284c7;
        --success: #0f766e;
        --warning: #b45309;
        --shadow: 0 22px 60px rgba(15, 23, 42, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 10%, rgba(127, 231, 255, 0.18), transparent 24%), radial-gradient(circle at 90% 18%, rgba(56, 189, 248, 0.18), transparent 22%), linear-gradient(135deg, var(--bg), var(--bg-2));
      }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }
      .shell {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 72px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 18px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        margin-bottom: 22px;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: .08em; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #02151d;
      }
      .nav { display: flex; gap: 10px; flex-wrap: wrap; }
      .nav a, .nav button {
        padding: 9px 16px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer;
      }
      .nav a.active { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #02151d; }
      .panel {
        background: var(--panel); border: 1px solid var(--panel-border); border-radius: 24px; box-shadow: var(--shadow);
      }
      .content { padding: 24px; }
      .title { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 3rem); }
      .lead { margin: 0 0 20px; color: var(--muted); line-height: 1.8; }
      .grid { display: grid; gap: 18px; }
      .field { display: grid; gap: 8px; }
      .field label { color: var(--muted); font-size: .82rem; }
      input, select {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03); color: var(--text); outline: none;
      }
      input:focus, select:focus { border-color: rgba(127,231,255,0.46); box-shadow: 0 0 0 4px rgba(127,231,255,0.08); }
      .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .payment-preview {
        min-height: 160px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        border: 1px dashed var(--panel-border);
        background: rgba(255,255,255,0.02);
      }
      .payment-preview img {
        max-width: 160px;
        max-height: 160px;
        object-fit: contain;
        display: none;
      }
      .placeholder {
        color: var(--muted);
        text-align: center;
        padding: 18px;
      }
      .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 14px; border: 1px solid transparent; font-weight: 800; cursor: pointer;
      }
      .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #02151d; }
      .btn.secondary { background: rgba(255,255,255,0.03); color: var(--text); border-color: var(--panel-border); }
      .status-box {
        margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(74, 222, 128, 0.08); border: 1px solid rgba(74, 222, 128, 0.18); color: var(--success);
      }
      .status-box.warning { background: rgba(251, 191, 36, 0.08); border-color: rgba(251, 191, 36, 0.2); color: var(--warning); }
      @media (max-width: 720px) {
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>支付中心</div>
        </div>
        <nav class="nav" aria-label="主导航">
          <a href="/transfer.html">首页</a>
          <a href="/account-management.html">账户管理</a>
          <a href="/payment-settings.html" class="active">收款设置</a>
          <a href="/transfer-entry.html">转账</a>
          <button id="themeToggle" type="button">🌙 夜间</button>
        </nav>
      </header>

      <section class="panel content">
        <h1 class="title">收款设置</h1>
        <p class="lead">管理收款方式、收款暗号与付款码图片。账户信息与支付信息保持分离，避免和账号中心混在一起。</p>

        <div class="grid">
          <div class="field">
            <label for="accountName">当前账号</label>
            <input id="accountName" type="text" readonly placeholder="登录后显示" />
          </div>

          <div class="row">
            <div class="field">
              <label for="paymentMethod">收款方式</label>
              <select id="paymentMethod">
                <option value="">请选择</option>
                <option value="wx">微信</option>
                <option value="alipay">支付宝</option>
                <option value="bank">银行卡</option>
              </select>
            </div>
            <div class="field">
              <label for="paymentSecret">收款暗号</label>
              <input id="paymentSecret" type="text" readonly placeholder="仅注册时设置，不可在此修改" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="paymentCodeInput">付款码图片</label>
              <input id="paymentCodeInput" type="file" accept="image/*" />
            </div>
            <div class="field">
              <label>当前付款码预览</label>
              <div class="payment-preview">
                <img id="paymentCodePreview" alt="付款码预览" />
                <div class="placeholder" id="paymentPlaceholder">未上传付款码</div>
              </div>
            </div>
          </div>

          <div class="cta-row">
            <button class="btn primary" type="button" id="saveSettingsBtn">保存收款设置</button>
            <button class="btn secondary" type="button" id="clearSettingsBtn">清空</button>
          </div>

          <div class="status-box" id="statusBox">请登录后再设置收款信息。</div>
        </div>
      </section>
    </main>

    <script>
      const themeToggle = document.getElementById('themeToggle');
      const statusBox = document.getElementById('statusBox');
      const accountsStorageKey = 'mctools-main-accounts';
      const currentAccountStorageKey = 'mctools-main-current-account';
      const themeStorageKey = 'mctools-main-theme';

      const accountNameInput = document.getElementById('accountName');
      const paymentMethodInput = document.getElementById('paymentMethod');
      const paymentSecretInput = document.getElementById('paymentSecret');
      const paymentCodeInput = document.getElementById('paymentCodeInput');
      const paymentCodePreview = document.getElementById('paymentCodePreview');
      const paymentPlaceholder = document.getElementById('paymentPlaceholder');

      function normalizeUserName(value) {
        return String(value || '').trim().toLowerCase();
      }

      function getAccounts() {
        try { return JSON.parse(localStorage.getItem(accountsStorageKey) || '{}') || {}; }
        catch { return {}; }
      }

      function saveAccounts(accounts) {
        try {
          localStorage.setItem(accountsStorageKey, JSON.stringify(accounts));
          return true;
        } catch (error) {
          console.error('保存账号数据失败：', error);
          return false;
        }
      }

      function getCurrentAccount() {
        try { return localStorage.getItem(currentAccountStorageKey) || ''; }
        catch { return ''; }
      }

      function setTheme(theme) {
        const normalized = theme === 'day' ? 'day' : 'night';
        document.documentElement.setAttribute('data-theme', normalized);
        themeToggle.textContent = normalized === 'day' ? '☀️ 白天' : '🌙 夜间';
        try { localStorage.setItem(themeStorageKey, normalized); } catch {}
      }

      function getPreferredTheme() {
        try { return localStorage.getItem(themeStorageKey) || 'night'; }
        catch { return 'night'; }
      }

      function showStatus(message, isWarning = false) {
        statusBox.textContent = message;
        statusBox.className = isWarning ? 'status-box warning' : 'status-box';
      }

      function loadAccountData() {
        const current = getCurrentAccount();
        const accounts = getAccounts();
        const account = accounts[normalizeUserName(current)] || {};

        if (!current) {
          accountNameInput.value = '';
          paymentMethodInput.value = '';
          paymentSecretInput.value = '';
          paymentCodePreview.removeAttribute('src');
          paymentCodePreview.style.display = 'none';
          paymentPlaceholder.style.display = 'block';
          showStatus('请登录后再设置收款信息。', true);
          return;
        }

        accountNameInput.value = account.accountName || current;
        paymentMethodInput.value = account.paymentMethod || '';
        paymentSecretInput.value = account.paymentSecret || '未设置';

        if (account.paymentCode) {
          paymentCodePreview.src = account.paymentCode;
          paymentCodePreview.style.display = 'block';
          paymentPlaceholder.style.display = 'none';
        } else {
          paymentCodePreview.removeAttribute('src');
          paymentCodePreview.style.display = 'none';
          paymentPlaceholder.style.display = 'block';
        }

        showStatus(`当前账号：${account.accountName || current}，收款方式与付款码已加载。`);
      }

      function compressImageToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const maxWidth = 900;
              const maxHeight = 900;
              let width = img.width;
              let height = img.height;
              const scale = Math.min(1, maxWidth / width, maxHeight / height);
              width = Math.max(1, Math.round(width * scale));
              height = Math.max(1, Math.round(height * scale));

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                reject(new Error('无法读取图片画布。'));
                return;
              }
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.72));
            };
            img.onerror = () => reject(new Error('图片读取失败。'));
            img.src = String(reader.result || '');
          };
          reader.onerror = () => reject(new Error('文件读取失败。'));
          reader.readAsDataURL(file);
        });
      }

      paymentCodeInput.addEventListener('change', async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        try {
          const dataUrl = await compressImageToDataUrl(file);
          paymentCodePreview.src = dataUrl;
          paymentCodePreview.style.display = 'block';
          paymentPlaceholder.style.display = 'none';
        } catch (error) {
          console.error(error);
          paymentCodePreview.removeAttribute('src');
          paymentCodePreview.style.display = 'none';
          paymentPlaceholder.style.display = 'block';
          showStatus('图片读取失败，请换一张更小的付款码图片。', true);
        }
      });

      document.getElementById('saveSettingsBtn').addEventListener('click', () => {
        const current = getCurrentAccount();
        const accounts = getAccounts();
        const key = normalizeUserName(current);
        if (!current || !accounts[key]) {
          showStatus('请先登录账号后再保存收款设置。', true);
          return;
        }

        const entry = accounts[key];
        entry.paymentMethod = paymentMethodInput.value;
        entry.paymentCode = paymentCodePreview.src || '';

        const saved = saveAccounts(accounts);
        if (!saved) {
          showStatus('保存失败：付款码图片太大，浏览器本地存储已满。请删掉旧图片或换更小的图片。', true);
          return;
        }

        showStatus('收款设置已保存。');
      });

      document.getElementById('clearSettingsBtn').addEventListener('click', () => {
        paymentMethodInput.value = '';
        paymentCodePreview.removeAttribute('src');
        paymentCodePreview.style.display = 'none';
        paymentPlaceholder.style.display = 'block';
        showStatus('已清空当前页面内容。', true);
      });

      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'day' ? 'night' : 'day';
        setTheme(next);
      });

      setTheme(getPreferredTheme());
      loadAccountData();
    </script>
  </body>
</html>
